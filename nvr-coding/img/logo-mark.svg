<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="NVR mark">
  <!--
    Mark: a bold geometric N with a volt diamond at the top right.
    The N is drawn as a path rather than set as text so the diamond stays
    locked to the letterform in every renderer, with no font dependency.
  -->
  <path d="M4 100 V0 H26 L74 64 V0 H96 V100 H74 L26 36 V100 Z" fill="#F5F5EE"/>
  <path d="M84 6 L100 22 L84 38 L68 22 Z" fill="#C7FF00"/>
</svg>