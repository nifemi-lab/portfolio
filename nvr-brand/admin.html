<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NVR — Staff Login</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="img/logo-mark.svg" type="image/svg+xml" />
</head>
<body class="login-page">

  <!-- ============ LOGIN PAGE ============ -->
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <img src="img/logo.svg" alt="NVR" class="logo" />
        <h1>NVR <span class="accent">Staff</span></h1>
        <p class="tagline">Staff access only — manage orders, sellers &amp; payouts</p>
      </div>

      <form class="login-form" id="loginForm">
        <div class="field">
          <label>Email address</label>
          <input type="email" id="auEmail" autocomplete="username" placeholder="you@nvrlab.com" required />
        </label>
        <div class="field">
          <label>Password</label>
          <input type="password" id="auPass" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn--volt btn--block btn-lg" id="loginBtn">
          Sign in to dashboard
        </button>
      </form>

      <p class="gate-note" id="gateMsg" role="alert"></p>
      <p class="gate-footer">
        Not staff? <a href="index.html" style="color:var(--volt); text-decoration:none;">Go to storefront</a>
      </p>
    </div>
  </main>

  <script src="js/catalog.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
